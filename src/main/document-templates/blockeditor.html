<script>
(() => {
  const root = document.documentElement;
  const blocks = [...document.head.querySelectorAll('style[clay-variant]')];
  const named = (name) => blocks.find((style) => style.getAttribute('clay-variant') === name);
  const saved = named(root.getAttribute('look'));
  if (saved) for (const style of blocks) style === saved ? style.removeAttribute('media') : style.setAttribute('media', 'not all');
  const slot = root.getAttribute('visitor-drafts');
  if (!slot) return;
  try {
    const file = location.pathname.replace(/\/{2,}/g, '/').match(/^(.*?\/[^/]+\.(?:html|htmlclay))(?:\/|$)/i);
    const path = file && file[1].toLowerCase() !== '/index.html' ? file[1] : '/';
    const hinted = named(JSON.parse(localStorage.getItem(`clay:visitor-drafts:${slot}@${path}`))?.data?.look);
    if (!hinted || hinted.getAttribute('media') !== 'not all') return;
    const hint = document.createElement('style');
    hint.setAttribute('clay', 'editor-ui');
    hint.setAttribute('clay-look-hint', '');
    hint.textContent = hinted.textContent;
    document.head.append(hint);
    setTimeout(() => hint.remove(), 4000);
  } catch {}
})();
</script>
